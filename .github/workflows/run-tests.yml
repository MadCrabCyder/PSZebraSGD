
name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PowerShell ${{ matrix.version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '5.1'
            executable: powershell.exe
          - version: '7'
            executable: pwsh.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        env:
          PS_EXECUTABLE: ${{ matrix.executable }}
        run: |
          & $env:PS_EXECUTABLE -NoProfile -NonInteractive -File .github/scripts/run-tests.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
